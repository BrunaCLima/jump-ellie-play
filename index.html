let actx = null, muted = store.get('jumpellie-mute', '0') === '1', siren = null;
function ac() {

  if (actx.state === 'suspended') actx.resume();
  return actx;

  if (muted) return; const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t0);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol) {
  if (muted) return; const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(a.destination); s.start();
}

  const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 3;
  o.frequency.setValueAtTime(base * 0.8, t0);
  o.frequency.linearRampToValueAtTime(base * (sad ? 1.1 : 1.5), t0 + 0.12);
  o.frequency.linearRampToValueAtTime(base * (sad ? 0.5 : 0.75), t0 + len);
  f.frequency.setValueAtTime(900, t0);
  f.frequency.linearRampToValueAtTime(2200, t0 + 0.12);
  f.frequency.linearRampToValueAtTime(700, t0 + len);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.32, t0 + 0.04);
  g.gain.setValueAtTime(0.32, t0 + len - 0.15);

}

// melodia em colcheias (notas MIDI): '-' segura a nota anterior, '.' é pausa
const SONG_LEAD = [
  '78 - 76 74 - 76 78 81', '78 - 74 71 - 74 76 78',
  '76 - 73 68 - 73 76 80', '78 - - 73 69 - 66 -',
  '74 78 81 - 78 81 86 -', '83 - 81 78 74 - 78 -',
  '80 - 76 73 76 80 83 -', '82 - 78 - 73 - 70 .',
].join(' ').split(' ');
const SONG_BASS = [38, 35, 37, 42, 38, 35, 37, 42];  // D, Bm, C#m, F#m, D, Bm, C#m, F#
const D = [62, 66, 69], BM = [62, 66, 71], CSM = [61, 64, 68], FSM = [61, 66, 69], FS = [61, 66, 70];
const SONG_CHORDS = [D, BM, CSM, FSM, D, BM, CSM, FS];
const STEP = 60 / 152 / 2;                           // 152 BPM, colcheia
const mhz = m => 440 * 2 ** ((m - 69) / 12);
let music = null, hatBuf = null;
function mnote(f, t0, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(vol, t0);
  g.gain.setValueAtTime(vol, t0 + dur * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(music.g);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function mhat(t0, vol) {
  if (!hatBuf) {
    const n = Math.floor(actx.sampleRate * 0.04);
    hatBuf = actx.createBuffer(1, n, actx.sampleRate);
    const d = hatBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
  }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = hatBuf; f.type = 'highpass'; f.frequency.value = 6000; g.gain.value = vol;
  s.connect(f).connect(g).connect(music.g); s.start(t0);
}
function schedMusic() {
  if (!music) return;
  while (music.next < actx.currentTime + 0.15) {
    const i = music.step % SONG_LEAD.length, t0 = music.next, bar = Math.floor(i / 8);
    const n = SONG_LEAD[i];
    if (n !== '-' && n !== '.') {
      let len = 1; while (SONG_LEAD[(i + len) % SONG_LEAD.length] === '-') len++;
      mnote(mhz(+n), t0, STEP * len * 0.95, 'square', 0.035);
    }
    const root = SONG_BASS[bar];
    mnote(mhz(i % 2 ? root + 12 : root), t0, STEP * 0.9, 'triangle', 0.11);
    if (i % 4 === 2) for (const m of SONG_CHORDS[bar]) mnote(mhz(m), t0, STEP * 0.8, 'square', 0.012);  // acorde
    if (i % 4 === 0) mnote(150, t0, 0.09, 'sine', 0.12);   // bumbo
    mhat(t0, i % 2 ? 0.05 : 0.025);
    music.step++; music.next += STEP;
  }
}
function startMusic() {
  stopMusic(); if (muted) return; const a = ac(); if (!a) return;
  const g = a.createGain(); g.connect(a.destination);
  music = { g, step: 0, next: a.currentTime + 0.05 };
  music.timer = setInterval(schedMusic, 25);
  schedMusic();
}
function stopMusic() {
  if (!music) return;
  clearInterval(music.timer);
  const g = music.g, now = actx.currentTime;
  g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(0, now + 0.08);
  setTimeout(() => g.disconnect(), 300);
  music = null;
}

let state = 'title', paused = false, t = 0, playT = 0, score = 0;
let hi = parseInt(store.get('jumpellie-hi', '0'), 10) || 0;
let speed = BASEV, spawnDist = 0, power = 0, ghostChain = 0, lastPower = -99;
let milestone = 1000, flash = 0, deadT = 0, readyT = 0, shake = 0, newHi = false, abd = null, sprayT = 0, sparkT = 0;
let evoLv = 0, evoT = 0, menuSel = 0;
let cat, obs = [], items = [], parts = [], pops = [];
const input = { jump: false, duck: false, jumpBuf: 0 };
const DEMO = location.hash.startsWith('#demo');

/* ================= TELEMETRIA (dados anônimos de jogo) ================= */
// Cole aqui a URL /exec do Apps Script. Vazia = o jogo não envia nada.
const TELEMETRIA_URL = '';
const VERSAO = '1.1.0';
const novoId = () => (window.crypto && crypto.randomUUID
  ? crypto.randomUUID()
  : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).toLowerCase();
let jogadorId = store.get('jumpellie-jogador', '');
if (!/^[a-z0-9-]{8,40}$/.test(jogadorId)) { jogadorId = novoId(); store.set('jumpellie-jogador', jogadorId); }
// teste A/B: cada jogador é sorteado uma vez e fica no mesmo grupo para sempre
let variante = store.get('jumpellie-variante', '');
if (variante !== 'A' && variante !== 'B') { variante = Math.random() < 0.5 ? 'A' : 'B'; store.set('jumpellie-variante', variante); }
const CATNIP_S = variante === 'B' ? 10 : 7;   // A = 7 s (duração original), B = 10 s
const sessaoId = novoId();
let partidaId = '';
// no modo #demo só envia com ?enviar, e marcado como teste
const FONTE = DEMO ? 'teste' : 'real';
const ENVIA = TELEMETRIA_URL !== '' && (!DEMO || location.search.includes('enviar'));
const KIND_VILAO = { cuke: 'SPROUT', walker: 'STALKER', hover: 'HOVERCUKE', flyer: 'ZAPWING', lord: 'OVERLORD' };
const fila = [];
function tel(evento, extra) {
  if (!ENVIA || !partidaId) return;
  fila.push(Object.assign({
    evento, fonte: FONTE, versao: VERSAO, variante,
    jogador_id: jogadorId, sessao_id: sessaoId, partida_id: partidaId,
    ts: new Date().toISOString(),
    pontuacao: Math.floor(score), duracao_s: Math.round(playT * 100) / 100,
    nivel: EVO[evoLv].name,
  }, extra));
  if (evento === 'morte' || evento === 'abandono' || fila.length >= 20) enviarFila(false);
}
function enviarFila(saindo) {
  if (!fila.length) return;
  const corpo = JSON.stringify({ eventos: fila.splice(0, fila.length) });
  try {
    if (saindo && navigator.sendBeacon) { navigator.sendBeacon(TELEMETRIA_URL, corpo); return; }
    fetch(TELEMETRIA_URL, { method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain' }, body: corpo }).catch(() => {});
  } catch (e) {}
}
setInterval(() => enviarFila(false), 15000);
window.addEventListener('pagehide', () => enviarFila(true));

// cenário
const stars = Array.from({ length: 46 }, () => ({ x: rand(0, W), y: rand(28, 96), ph: rand(0, 6), b: Math.random() < 0.3 }));
let roofs = [], blocks = [];
function addRoof() {
  const last = roofs[roofs.length - 1];
  const x = last ? last.x + last.w + randi(0, 6) : -10;
  const w = randi(24, 60), h = randi(8, 34);
  const win = [];
  for (let wy = 4; wy < h - 3; wy += 6) for (let wx = 3; wx < w - 4; wx += 6)
    if (Math.random() < 0.22) win.push([wx, wy, Math.random() < 0.5 ? '#4a4614' : '#2a2a6a']);
  roofs.push({ x, w, h, win, chim: Math.random() < 0.4 ? randi(4, w - 9) : -1, ant: Math.random() < 0.25, kitty: Math.random() < 0.12 ? randi(6, w - 10) : -1 });
}
function addBlock() {
  const last = blocks[blocks.length - 1];
  const x = last ? last.x + last.w + randi(6, 10) : -6;
  blocks.push({ x, w: randi(12, 46), two: Math.random() < 0.45 });
}
while (!roofs.length || roofs[roofs.length - 1].x + roofs[roofs.length - 1].w < W + 40) addRoof();
while (!blocks.length || blocks[blocks.length - 1].x + blocks[blocks.length - 1].w < W + 40) addBlock();

function scrollWorld(dx) {
  for (const s of stars) { s.x -= dx * 0.04; if (s.x < 0) s.x += W; }
  for (const r of roofs) r.x -= dx * 0.3;
  roofs = roofs.filter(r => r.x + r.w > -6);
  while (roofs[roofs.length - 1].x + roofs[roofs.length - 1].w < W + 40) addRoof();
  for (const b of blocks) b.x -= dx;
  blocks = blocks.filter(b => b.x + b.w > -6);
  while (blocks[blocks.length - 1].x + blocks[blocks.length - 1].w < W + 40) addBlock();
}

function resetRun() {
  cat = { y: GROUND, vy: 0, onGround: true, duck: false, anim: 0 };
  obs = []; items = []; parts = []; pops = [];
  score = 0; speed = BASEV; spawnDist = 160; power = 0; playT = 0; lastPower = -99;
  milestone = 1000; flash = 0; newHi = false; abd = null; shake = 0;
  evoLv = 0; evoT = 0;
  input.jumpBuf = 0;
  stopSiren(); stopMusic();
}
resetRun();

function start() {
  resetRun();
  state = 'ready'; readyT = 1.3;
  sfx.jingle();
  partidaId = novoId();
  tel('partida_inicio');
}
// volta para a tela inicial (pelo menu de pausa ou depois do GAME OVER)
function goTitle() {
  if (state === 'play' || state === 'ready') tel('abandono');   // saiu no meio da partida
  paused = false; menuSel = 0;
  if (actx) actx.resume();
  if (Math.floor(score) > hi) { hi = Math.floor(score); store.set('jumpellie-hi', String(hi)); }
  resetRun();
  state = 'title';
}

/* ================= SPAWN ================= */
// nível evolutivo atual dos pepinos (0 a 4)
const evoLevel = () => { let l = 0; EVO.forEach((e, i) => { if (score >= e.at) l = i; }); return l; };
function spawn() {
  const gap = speed * rand(0.85, 1.45) + 80;
  const x = W + 10, lv = evoLevel();
  // sorteia entre as formas já desbloqueadas, com a mais nova aparecendo mais
  const kinds = ['cuke', 'walker', 'hover', 'flyer', 'lord'].slice(0, lv + 1);
  const wts = kinds.map((k, i) => i === lv && lv > 0 ? 1.6 : 1);
  let r = Math.random() * wts.reduce((p, c) => p + c, 0), kind = kinds[0];
  for (let i = 0; i < kinds.length; i++) { if ((r -= wts[i]) < 0) { kind = kinds[i]; break; } }
  let o;
  if (kind === 'flyer') {
    const alt = pick(lv >= 4 ? ['low', 'mid', 'mid', 'high'] : ['low', 'mid', 'high']);
    const y = alt === 'low' ? GROUND - 13 : alt === 'mid' ? GROUND - 21 : GROUND - 42;
    o = { kind, x, y, w: 16, h: 13, vx: alt === 'mid' ? 0 : 30, alt, g: randi(0, 3), ph: rand(0, 6) };
  } else if (kind === 'hover') {
    o = { kind, x, y: GROUND - 12, w: 20, h: 11, vx: 45 };
  } else if (kind === 'walker') {
    o = { kind, x, y: GROUND - 15, w: 9, h: 15, vx: 22 };
  } else if (kind === 'lord') {
    o = { kind, x, y: GROUND - 19, w: 13, h: 19, vx: 12 };
  } else {
    let n = 1;
    if (Math.random() < (score > 500 ? 0.5 : 0.3)) n++;
    if (score > 500 && Math.random() < 0.25) n++;
    const cs = [];
    for (let i = 0; i < n; i++) cs.push({ dx: i * 9, h: randi(13, 18) });
    const h = Math.max(...cs.map(c => c.h));
    o = { kind: 'cuke', x, y: GROUND - h, w: n * 9 - 2, h, vx: 0, cs };
  }
  obs.push(o);
  addItems(o, gap);
  return gap;
}

function addItems(o, gap) {
  const cx = o.x + o.w / 2;
  let powerHere = playT - lastPower > 14 && power <= 0 && Math.random() < 0.3;
  const usePower = () => { powerHere = false; lastPower = playT; return 'power'; };
  // arco de bolinhas sobre obstáculos parados (segue a parábola do pulo)
  if (o.vx === 0 && o.kind !== 'flyer' && Math.random() < 0.6) {
    for (let i = -3; i <= 3; i++) {
      const tt = i * 0.075, hf = 61 - 750 * tt * tt;
      items.push({ kind: i === 0 && powerHere ? usePower() : 'dot', x: cx + i * speed * 0.075, y: GROUND - hf - 7 });
    }
  }
  // bolinhas embaixo do pepino voador do meio (pra quem abaixa)
  if (o.kind === 'flyer' && o.alt === 'mid') {
    for (let i = 0; i < 4; i++) items.push({ kind: 'dot', x: o.x - 6 + i * 10, y: GROUND - 5 });
  }
  // trilha no chão depois do obstáculo
  if (Math.random() < 0.5) {
    for (let x = o.x + o.w + 30; x < o.x + gap - 35; x += 11) items.push({ kind: 'dot', x, y: GROUND - 9 });
  }
  if (Math.random() < 0.18) items.push({ kind: 'fish', x: o.x + gap * 0.55, y: GROUND - 62, ph: rand(0, 6) });
  else if (powerHere) items.push({ kind: usePower(), x: o.x + gap * 0.5, y: GROUND - 10 });
}

/* ================= COLISÃO ================= */
const hit = (a, b, p = 0) => a.x - p < b.x + b.w && a.x + a.w + p > b.x && a.y - p < b.y + b.h && a.y + a.h + p > b.y;
function catBoxes() {
  const h = cat.duck ? DUCK_H : CAT_H, top = Math.round(cat.y) - h;
  return (cat.duck ? DUCK_BOX : STAND_BOX).map(b => ({ x: CAT_X + b.x, y: top + b.y, w: b.w, h: b.h }));
}
function obBoxes(o) {
  switch (o.kind) {
    case 'cuke':   return o.cs.map(c => ({ x: o.x + c.dx + 1, y: GROUND - c.h + 1, w: 5, h: c.h - 1 }));
    case 'walker': return [{ x: o.x + 1, y: o.y + 2, w: 7, h: 13 }];
    case 'hover':  return [{ x: o.x + 1, y: o.y + 2, w: 17, h: 7 }];
    case 'lord':   return [{ x: o.x + 1, y: o.y + 2, w: 11, h: 17 }];
    case 'flyer':  return [{ x: o.x + 4, y: o.y + 2, w: 8, h: 11 }, { x: o.x + 1, y: o.y + 3, w: 14, h: 3 }];
  }
  return [];
}
function itemBox(it) {
  if (it.kind === 'dot') return { x: it.x - 1, y: it.y - 1, w: 2, h: 2 };
  if (it.kind === 'fish') return { x: it.x - 5, y: it.y - 3, w: 10, h: 5 };
  return { x: it.x - 3, y: it.y - 3, w: 7, h: 7 };
}

/* ================= EFEITOS ================= */
function burst(x, y, col, n = 14) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-90, 90), vy: rand(-140, -20), g: 400, life: rand(0.4, 0.8), col, s: Math.random() < 0.3 ? 2 : 1 });
}
function dust(n) {
  for (let i = 0; i < n; i++) parts.push({ x: CAT_X + rand(2, 18), y: GROUND - 1, vx: rand(-30, 10), vy: rand(-30, -5), g: 60, life: rand(0.2, 0.4), col: '#6a6aa8', s: 1 });
}
function pop(x, y, txt, col) { pops.push({ x, y, txt, col, life: 0.9 }); }

function collect(it) {
  it.got = true;
  if (it.kind === 'dot') { score += 10; sfx.dot(); }
  else if (it.kind === 'fish') { score += 50; sfx.fish(); pop(it.x, it.y - 8, '50', '#7fd7ff'); burst(it.x, it.y, '#7fd7ff', 6); }
  else { score += 50; power = CATNIP_S; ghostChain = 0; sfx.power(); pop(it.x, it.y - 10, 'POWER!', '#3ddc4a'); tel('catnip'); }
}

function die(o) {
  // vilao = forma que encostou na Ellie; nivel = evolução em que a partida estava
  tel('morte', { vilao: o ? KIND_VILAO[o.kind] : EVO[evoLv].name });
  state = 'dead'; deadT = 0; shake = 0.25;
  stopSiren(); stopMusic(); sfx.death();
  // a nave desce bem em cima da Ellie (disco 40 x 14, desenhado em escala 2)
  abd = { x: CAT_X - 6, y: -20, vx: 0, catY0: cat.y, catY: cat.y, beam: false };
  if (Math.floor(score) > hi) { hi = Math.floor(score); newHi = true; store.set('jumpellie-hi', String(hi)); }
}

/* ================= DEMO (bot simples, usado só com #demo) ================= */
function bot() {
  input.duck = false;
  const ahead = obs.filter(o => !o.eaten && o.x + o.w > CAT_X).sort((a, b) => a.x - b.x)[0];
  if (!ahead) { input.jump = false; return; }
  const d = ahead.x - (CAT_X + 20), rel = speed + ahead.vx;
  if (ahead.kind === 'flyer' && ahead.alt === 'mid') { input.duck = d < rel * 0.25; return; }
  if (ahead.kind === 'flyer' && ahead.alt === 'high') return;
  if (d > 0 && d < rel * 0.2 && cat.onGround) { input.jump = true; input.jumpBuf = 0.1; }
  if (cat.vy > 0) input.jump = false;
}

/* ================= UPDATE ================= */
function update(dt) {
  t += dt;
  if (shake > 0) shake -= dt;
  if (paused) return;

  if (state === 'title') { scrollWorld(70 * dt); cat.anim += dt * 7; return; }
  if (state === 'ready') { readyT -= dt; if (readyT <= 0) { state = 'play'; input.jumpBuf = 0; startMusic(); } return; }
  if (state === 'dead') {
    deadT += dt;
    updateParts(dt, 0);
    updateAbduction(dt);
    if (DEMO && deadT > 3.5) start();
    return;
  }

  // jogando
  if (DEMO) bot();
  playT += dt;
  speed = Math.min(MAXV, BASEV + playT * 3.2);
  const dx = speed * dt;
  scrollWorld(dx);

  // física do gato
  if (input.jumpBuf > 0) input.jumpBuf -= dt;
  if (cat.onGround && input.jumpBuf > 0) {
    cat.vy = -JUMPV; cat.onGround = false; input.jumpBuf = 0; sfx.jump();
  }
  if (!cat.onGround) {
    if (!input.jump && cat.vy < -JUMPCUT) cat.vy = -JUMPCUT;
    cat.vy += G * dt * (input.duck ? 2.6 : 1);
    cat.y += cat.vy * dt;
    if (cat.y >= GROUND) { cat.y = GROUND; cat.vy = 0; cat.onGround = true; dust(4); }
  }
  cat.duck = input.duck && cat.onGround;
  cat.anim += dt * speed / 14;

  // pontos por distância
  score += dx * 0.06;
  if (score >= milestone) { milestone += 1000; flash = 1.2; sfx.mile(); }
  if (flash > 0) flash -= dt;
  // os pepinos evoluem
  const lv = evoLevel();
  if (lv > evoLv) { evoLv = lv; evoT = 2.4; sfx.evolve(); tel('evolucao', { vilao: EVO[lv].name }); }
  if (evoT > 0) evoT -= dt;

  // poder da erva-de-gato
  if (power > 0) {
    power -= dt;
    sparkT -= dt;
    if (sparkT <= 0) {
      sparkT = 0.04;
      parts.push({ x: CAT_X + rand(0, 22), y: Math.round(cat.y) - rand(0, 13), vx: rand(-20, 20), vy: rand(-30, 0), g: 0, life: 0.35, col: pick(['#ffff00', '#ffffff', '#3ddc4a', '#ff7eb0']), s: 1 });
    }
    if (power <= 0) { power = 0; stopSiren(); }
  }

  // spawn
  spawnDist -= dx;
  if (spawnDist <= 0) spawnDist = spawn();

  // move objetos
  for (const o of obs) {
    o.x -= dx + o.vx * dt;
    if (o.eaten) o.y -= 40 * dt;
    if (o.kind === 'hover' && Math.random() < 0.4) parts.push({ x: o.x + rand(4, 16), y: GROUND - 1, vx: rand(10, 40), vy: rand(-20, -4), g: 40, life: 0.3, col: pick(['#7dff4a', '#00ffff']), s: 1 });
  }
  obs = obs.filter(o => !o.dead && o.x + o.w > -30 && o.x < W + 60 && o.y > -20);
  for (const it of items) it.x -= dx;
  items = items.filter(it => !it.got && it.x > -12);

  // colisões
  const boxes = catBoxes();
  for (const it of items) if (boxes.some(b => hit(b, itemBox(it), 2))) collect(it);
  for (const o of obs) {
    if (o.eaten) continue;
    if (!obBoxes(o).some(ob => boxes.some(b => hit(b, ob)))) continue;
    if (power > 0) {
      if (o.kind === 'flyer') {
        o.eaten = true; o.vx = -(speed + 90);
        ghostChain++;
        const pts = 200 * 2 ** Math.min(ghostChain - 1, 3);
        score += pts; pop(o.x + 8, o.y - 6, String(pts), '#00ffff'); sfx.eat();
      } else {
        o.dead = true; score += 100; sfx.smash();
        burst(o.x + o.w / 2, o.y + o.h / 2, '#2fa83c', 10);
        burst(o.x + o.w / 2, o.y + o.h / 2, '#8fe36a', 8);
        pop(o.x + o.w / 2, o.y - 8, '100', '#ffff00');
      }
    } else { die(o); return; }
  }

  updateParts(dt, dx);
}

const ease = k => k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k);
const ABD_Y = 34;  // altura em que a nave para
function updateAbduction(dt) {
  const a = abd; if (!a) return;
  if (deadT < 0.75) a.y = -20 + (ABD_Y + 20) * ease(deadT / 0.75);
  else if (deadT < 2.25) a.y = ABD_Y + Math.round(Math.sin(deadT * 6));
  a.beam = deadT > 0.8 && deadT < 2.2;
  // a Ellie sobe pelo raio até sumir dentro da nave
  const k = ease((deadT - 0.95) / 1.15);
  a.catY = a.catY0 + (ABD_Y + 12 - a.catY0) * k;
  if (a.beam && Math.random() < 0.6) parts.push({ x: a.x + rand(6, 34), y: rand(ABD_Y + 16, GROUND), vx: 0, vy: rand(-90, -40), g: 0, life: rand(0.2, 0.5), col: pick(['#7dff4a', '#ffffff', '#b6ffa0']), s: 1 });
  if (deadT > 2.25) {  // vai embora acelerando
    a.vx += 700 * dt;
    a.x += a.vx * dt; a.y -= a.vx * dt * 0.35;
  }
}
function drawBeam(a) {
  const top = Math.round(a.y) + 14, flick = Math.floor(t * 20) % 2;
  for (let y = top; y < GROUND; y++) {
    const f = (y - top) / (GROUND - top), half = Math.round(7 + f * 14);
    ctx.fillStyle = ((y + Math.floor(t * 40)) >> 1) % 3 === 0 ? 'rgba(180,255,150,.32)' : flick ? 'rgba(125,255,74,.2)' : 'rgba(125,255,74,.15)';
    ctx.fillRect(Math.round(a.x) + 20 - half, y, half * 2, 1);
  }
}

function updateParts(dt, dx) {
  for (const p of parts) { p.x += p.vx * dt - dx; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.y -= 18 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);
}

/* ================= DESENHO ================= */
function rrect(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x + 2, y, w - 4, 1); ctx.fillRect(x + 2, y + h - 1, w - 4, 1);
  ctx.fillRect(x, y + 2, 1, h - 4); ctx.fillRect(x + w - 1, y + 2, 1, h - 4);
  ctx.fillRect(x + 1, y + 1, 1, 1); ctx.fillRect(x + w - 2, y + 1, 1, 1);
  ctx.fillRect(x + 1, y + h - 2, 1, 1); ctx.fillRect(x + w - 2, y + h - 2, 1, 1);
}

function drawBackground() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // estrelas
  for (const s of stars) {
    const on = Math.sin(t * 3 + s.ph) > -0.3;
    if (!on) continue;
    ctx.fillStyle = s.b ? '#dedeff' : '#4a4a8a';
    ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
  }
  ctx.drawImage(SPR.moon, 340, 32);
  const mx = W + 40 - ((t * 22) % (W + 400));
  if (mx > -40 && state !== 'dead') {
    drawUfo(Math.round(mx), 44 + Math.round(Math.sin(t * 2) * 2), 2);
    if (Math.floor(t * 3) % 4 === 0) { ctx.fillStyle = 'rgba(125,255,74,.12)'; ctx.fillRect(Math.round(mx) + 12, 58, 16, GROUND - 58); }
  }
  // telhados (parallax)
  for (const r of roofs) {
    const x = Math.round(r.x), top = GROUND - r.h;
    ctx.fillStyle = '#06061e'; ctx.fillRect(x, top, r.w, r.h);
    ctx.fillStyle = '#1a1a70';
    ctx.fillRect(x, top, r.w, 1); ctx.fillRect(x, top, 1, r.h); ctx.fillRect(x + r.w - 1, top, 1, r.h);
    for (const [wx, wy, c] of r.win) { ctx.fillStyle = c; ctx.fillRect(x + wx, top + wy, 2, 2); }
    if (r.chim >= 0) {
      ctx.fillStyle = '#06061e'; ctx.fillRect(x + r.chim, top - 5, 5, 5);
      ctx.fillStyle = '#1a1a70'; ctx.fillRect(x + r.chim, top - 5, 5, 1); ctx.fillRect(x + r.chim, top - 5, 1, 5); ctx.fillRect(x + r.chim + 4, top - 5, 1, 5);
    }
    if (r.ant) {
      ctx.fillStyle = '#1a1a70';
      ctx.fillRect(x + r.w - 6, top - 8, 1, 8); ctx.fillRect(x + r.w - 9, top - 7, 7, 1); ctx.fillRect(x + r.w - 8, top - 4, 5, 1);
    }
    if (r.kitty >= 0) { // silhueta de gatinho no telhado
      const k = x + r.kitty; ctx.fillStyle = '#1a1a70';
      ctx.fillRect(k, top - 5, 4, 5); ctx.fillRect(k, top - 6, 1, 1); ctx.fillRect(k + 3, top - 6, 1, 1);
      ctx.fillRect(k + 4, top - 2, 3, 2); ctx.fillRect(k + 6, top - 4, 1, 2);
    }
  }
  // paredes estilo labirinto
  ctx.fillStyle = '#000'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#2121de';
  ctx.fillRect(0, 20, W, 1); ctx.fillRect(0, 23, W, 1);
  ctx.fillRect(0, GROUND + 1, W, 1); ctx.fillRect(0, GROUND + 4, W, 1);
  ctx.fillRect(0, H - 2, W, 1);
  for (const b of blocks) {
    const x = Math.round(b.x);
    if (b.two) { rrect(x, 137, b.w, 8, '#2121de'); rrect(x, 148, b.w, 8, '#2121de'); }
    else rrect(x, 139, b.w, 14, '#2121de');
  }
}

function drawCuke(x, y, w, h) {
  ctx.fillStyle = '#1d7a2a'; ctx.fillRect(x + 1, y, w - 2, h); ctx.fillRect(x, y + 1, w, h - 2);
  ctx.fillStyle = '#2fa83c'; ctx.fillRect(x + 1, y + 1, 2, h - 2);
  ctx.fillStyle = '#8fe36a';
  for (let i = 7; i < h - 2; i += 4) ctx.fillRect(x + ((i >> 2) % 2 ? w - 3 : 3), y + i, 1, 1);
  ctx.fillStyle = '#7dff4a'; ctx.fillRect(x + 1, y - 3, 1, 3); ctx.fillRect(x + 5, y - 3, 1, 3);
  ctx.fillStyle = '#ff2a2a'; ctx.fillRect(x + 1, y - 4, 1, 1); ctx.fillRect(x + 5, y - 4, 1, 1);
  // olhinhos bravos
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, y + 3, 2, 2); ctx.fillRect(x + 4, y + 3, 2, 2);
  ctx.fillStyle = '#000'; ctx.fillRect(x + 1, y + 4, 1, 1); ctx.fillRect(x + 4, y + 4, 1, 1);
  ctx.fillStyle = '#0d4a16'; ctx.fillRect(x + 1, y + 2, 2, 1); ctx.fillRect(x + 4, y + 2, 2, 1);
}
function drawUfo(x, y, k = 1) {
  const r = (c, a, b, w, h) => { ctx.fillStyle = c; ctx.fillRect(x + a * k, y + b * k, w * k, h * k); };
  r('#7fe8ff', 8, 0, 4, 1); r('#7fe8ff', 7, 1, 6, 2);
  r('#7dff4a', 9, 1, 2, 2); r('#000', 9, 1, 1, 1);
  r('#a0a0b8', 3, 3, 14, 1);
  r('#c8c8dc', 0, 4, 20, 1);
  r('#6a6a80', 1, 5, 18, 1);
  r('#3a3a4a', 6, 6, 8, 1);
  const f = Math.floor(t * 6);
  ['#ff2a2a', '#ffff00', '#00ffff', '#ff7eb0'].forEach((c, i) => r((f + i) % 2 ? c : '#3a3a4a', 2 + i * 5, 4, 1, 1));
}
function drawOb(o) {
  const x = Math.round(o.x), y = Math.round(o.y);
  if (o.kind === 'cuke') for (const c of o.cs) drawCuke(x + c.dx, GROUND - c.h, 7, c.h);
  else if (o.kind === 'walker') ctx.drawImage(SPR.walker[Math.floor(t * 8) % 2], x, y);
  else if (o.kind === 'lord') ctx.drawImage(SPR.lord[Math.floor(t * 5) % 2], x, y);
  else if (o.kind === 'hover') ctx.drawImage(SPR.hover[Math.floor(t * 12) % 2], x, y + Math.round(Math.sin(t * 8)));
  else if (o.kind === 'flyer') {
    const f = Math.floor(t * 8) % 2;
    let s;
    if (o.eaten) s = SPR.eyes;
    else if (power > 0) s = (power < 2 && Math.floor(t * 6) % 2) ? SPR.flash[f] : SPR.fright[f];
    else s = SPR.flyer[o.g][f];
    const bob = o.alt === 'mid' || o.eaten ? 0 : Math.round(Math.sin(t * 6 + o.ph));
    ctx.drawImage(s, x, y + bob);
  }
}
function drawItem(it) {
  const x = Math.round(it.x), y = Math.round(it.y);
  if (it.kind === 'dot') { ctx.fillStyle = '#ffb8ae'; ctx.fillRect(x - 1, y - 1, 2, 2); }
  else if (it.kind === 'fish') ctx.drawImage(SPR.fish, x - 5, y - 2 + Math.round(Math.sin(t * 5 + it.ph)));
  else if (Math.floor(t * 5) % 2 === 0) ctx.drawImage(SPR.leaf, x - 3, y - 3);
}
function drawCat() {
  let s;
  const set = power > 0 && !(power < 2 && Math.floor(t * 10) % 2) ? SPR.catP : SPR.cat;
  if (state === 'dead') s = SPR.catDead;
  else if (state === 'ready') s = set.stand;
  else if (!cat.onGround) s = set.jump;
  else if (cat.duck) s = Math.floor(cat.anim) % 2 ? set.duckA : set.duckB;
  else s = Math.floor(cat.anim) % 2 ? set.runA : set.runB;
  if (state === 'dead' && abd) {
    if (deadT > 2.1) return;  // já está dentro da nave
    // some por dentro da nave: só desenha o que está abaixo do disco
    ctx.save();
    ctx.beginPath(); ctx.rect(0, Math.round(abd.y) + 13, W, H); ctx.clip();
    const wob = deadT > 0.95 ? Math.round(Math.sin(deadT * 14)) : 0;
    ctx.drawImage(s, CAT_X + wob, Math.round(abd.catY) - s.height);
    ctx.restore();
    return;
  }
  ctx.drawImage(s, CAT_X, Math.round(cat.y) - s.height);
}

function drawHUD() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 20);
  const white = '#dedeff';
  if (state !== 'play' || Math.floor(t * 3) % 2) text('1UP', 24, 2, white);
  const sc = String(Math.floor(score)).padStart(5, '0');
  if (!(flash > 0 && Math.floor(t * 8) % 2)) text(sc, 24, 11, flash > 0 ? '#ffff00' : white);
  text('HI SCORE', W / 2, 2, white, 1, 'center');
  text(String(Math.max(hi, state === 'play' ? Math.floor(score) : 0)).padStart(5, '0'), W / 2, 11, white, 1, 'center');
  text(muted ? 'M:MUTED' : 'M:SOUND', W - 8, 2, '#4a4a8a', 1, 'right');
  if (power > 0) {
    text('CATNIP', W - 68, 11, '#3ddc4a');
    ctx.fillStyle = '#0d4a16'; ctx.fillRect(W - 30, 12, 22, 5);
    ctx.fillStyle = power < 2 && Math.floor(t * 8) % 2 ? '#ffffff' : '#3ddc4a';
    ctx.fillRect(W - 30, 12, Math.ceil(22 * power / CATNIP_S), 5);
  }
}

function drawTitle() {
  textOut('JUMP ELLIE', W / 2, 28, '#ffff00', 4);
  text('RUN, ELLIE, RUN!', W / 2, 60, '#ff3f9a', 1, 'center');
  // a evolução dos pepinos alienígenas, estilo tela de abertura de fliperama
  const f = Math.floor(t * 6) % 2, base = 89;
  EVO.forEach((e, i) => {
    const cx = 44 + i * 78;
    let s = null;
    if (i === 0) drawCuke(cx - 3, base - 16, 7, 16);
    else s = [SPR.walker[f], SPR.hover[f], SPR.flyer[0][f], SPR.lord[f]][i - 1];
    if (s) ctx.drawImage(s, cx - (s.width >> 1), base - s.height);
    text(e.name, cx, base + 4, e.col, 1, 'center');
    if (i < EVO.length - 1) text('>', cx + 39, base - 10, '#6a6aa8', 1, 'center');
  });
  let x = 120;
  ctx.fillStyle = '#ffb8ae'; ctx.fillRect(x, 108, 2, 2); text('10', x + 6, 105, '#dedeff'); x += 34;
  ctx.drawImage(SPR.fish, x, 105); text('50', x + 14, 105, '#dedeff'); x += 42;
  if (f) ctx.drawImage(SPR.leaf, x, 104); text('CATNIP = POWER', x + 11, 105, '#3ddc4a');
  if (Math.floor(t * 2.2) % 2 === 0) text('PRESS SPACE OR TAP', W / 2, 117, '#ffff00', 1, 'center');
  if (ENVIA) text('THIS GAME SENDS ANONYMOUS PLAY STATS', W / 2, 150, '#6a6aa8', 1, 'center');
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round(rand(-2, 2)), Math.round(rand(-2, 2)));
  drawBackground();
  if (state !== 'title') {
    for (const it of items) drawItem(it);
    for (const o of obs) drawOb(o);
  }
  drawCat();
  for (const p of parts) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  for (const p of pops) text(p.txt, Math.round(p.x), Math.round(p.y), p.col, 1, 'center');
  if (state === 'dead' && abd) {
    if (abd.beam) drawBeam(abd);
    drawUfo(Math.round(abd.x), Math.round(abd.y), 2);
  }
  ctx.restore();
  drawHUD();

  if (state === 'title') drawTitle();
  else if (state === 'ready') textOut('READY!', W / 2, 62, '#ffff00', 2);
  else if (state === 'dead' && deadT > 2.6) {
    textOut('GAME OVER', W / 2, 44, '#ff2a2a', 3, '#5a0000');
    text('SCORE ' + String(Math.floor(score)).padStart(5, '0'), W / 2, 74, '#dedeff', 1, 'center');
    if (newHi && Math.floor(t * 4) % 2) text('NEW HIGH SCORE!', W / 2, 86, '#ffb8ff', 1, 'center');
    if (Math.floor(t * 2.2) % 2 === 0) text('PRESS SPACE OR TAP TO PLAY', W / 2, 100, '#ffff00', 1, 'center');
    text('ESC: MAIN MENU', W / 2, 113, '#6a6aa8', 1, 'center');
  }
  if (state === 'play' && evoT > 0 && !paused && Math.floor(t * 6) % 3) {
    const e = EVO[evoLv];
    textOut('EVOLUTION!', W / 2, 36, '#7dff4a', 2, '#0d4a16');
    text('LV' + (evoLv + 1) + ' ' + e.name, W / 2, 56, e.col, 1, 'center');
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 24, W, GROUND - 24);
    textOut('PAUSED', W / 2, 40, '#ffff00', 3);
    MENU.forEach((m, i) => {
      const on = i === menuSel;
      text((on ? '> ' : '  ') + m, W / 2, MENU_Y[i], on ? '#ffff00' : '#6a6aa8', 1, 'center');
    });
    text('ARROWS + SPACE', W / 2, 112, '#4a4a8a', 1, 'center');
  }
}

/* ================= ENTRADA ================= */
const MENU = ['RESUME', 'MAIN MENU'], MENU_Y = [76, 90];
function menuPick(i) { if (i === 1) goTitle(); else setPause(false); }
function pressJump(repeat) {
  ac();
  if (state === 'title') { start(); return; }
  if (state === 'dead') { if (deadT > 1) start(); return; }
  if (paused) { if (!repeat) menuPick(menuSel); return; }
  input.jump = true;
  if (!repeat) input.jumpBuf = 0.12;
}
function releaseJump() { input.jump = false; }
function setPause(p) {
  if (state !== 'play') { paused = false; return; }
  paused = p; menuSel = 0;
  if (actx) { p ? actx.suspend() : actx.resume(); }
}
function toggleMute() {
  muted = !muted; store.set('jumpellie-mute', muted ? '1' : '0');
  if (muted) { stopSiren(); stopMusic(); }
  else if (state === 'play') { startMusic(); if (power > 0) startSiren(); }
}

window.addEventListener('keydown', e => {
  const k = e.code;
  if (paused && (k === 'ArrowUp' || k === 'ArrowDown' || k === 'KeyW' || k === 'KeyS')) { e.preventDefault(); menuSel = 1 - menuSel; return; }
  if (paused && k === 'Enter') { menuPick(menuSel); return; }
  if (state === 'dead' && (k === 'Escape' || k === 'Backspace')) { goTitle(); return; }
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') { e.preventDefault(); pressJump(e.repeat); }
  else if (k === 'ArrowDown' || k === 'KeyS') { e.preventDefault(); input.duck = true; }
  else if (k === 'KeyP' || k === 'Escape') { if (!e.repeat) setPause(!paused); }
  else if (k === 'KeyM') { if (!e.repeat) toggleMute(); }
  else if (k === 'F11') { e.preventDefault(); if (!e.repeat && window.pywebview && window.pywebview.api) window.pywebview.api.tela_cheia(); }
});
window.addEventListener('keyup', e => {
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') releaseJump();
  else if (k === 'ArrowDown' || k === 'KeyS') input.duck = false;
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (paused) {  // no menu de pausa, toque na opção escolhida
    const r = cv.getBoundingClientRect(), y = (e.clientY - r.top) / r.height * H;
    menuPick(Math.abs(y - MENU_Y[1] - 3) < 7 ? 1 : 0);
    return;
  }
  pressJump(false);
});
window.addEventListener('pointerup', releaseJump);
window.addEventListener('pointercancel', releaseJump);
const bJump = document.getElementById('bJump'), bDuck = document.getElementById('bDuck');
document.getElementById('bMenu').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'play') setPause(!paused);
  else if (state === 'dead') goTitle();
});
bJump.addEventListener('pointerdown', e => { e.preventDefault(); pressJump(false); });
bDuck.addEventListener('pointerdown', e => { e.preventDefault(); ac(); input.duck = true; });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => bDuck.addEventListener(ev, () => { input.duck = false; }));
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });
window.addEventListener('blur', () => { if (state === 'play' && !DEMO) setPause(true); });

/* ================= ESCALA ================= */
function fit() {
  const maxW = Math.min(window.innerWidth - 60, 1400);
  const maxH = window.innerHeight * 0.66;
  let s = Math.min(maxW / W, maxH / H);
  if (s >= 2) s = Math.floor(s);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('pywebviewready', () => { document.getElementById('dicaF11').hidden = false; });
fit();

/* ================= LOOP ================= */
let last = performance.now(), congelado = false;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt > 0 && !congelado) update(dt);
  draw();
  requestAnimationFrame(frame);
}
if (DEMO) {
  start();
  // #demo30 simula 30 s antes de desenhar (usado para conferir o jogo)
  const pre = parseFloat(location.hash.slice(5)) || 0;
  for (let i = 0; i < pre * 60; i++) { update(1 / 60); if (location.search.includes('poder') && state === 'play' && power <= 0 && i % 600 === 0) { power = CATNIP_S; } }
  // ?morte=1.5 força a derrota e avança a animação da abdução até esse ponto
  const m = location.search.match(/morte=([\d.]+)/);
  if (m) { if (state === 'play') die(); for (let i = 0; i < parseFloat(m[1]) * 60; i++) update(1 / 60); congelado = true; }
}
requestAnimationFrame(frame);
})();
</script>
